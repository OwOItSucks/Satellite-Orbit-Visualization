name: Fetch Latest CSS OEM and Deploy

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:

# 允许同时有多个部署，取消排队
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Fetch OEM from CMSE
        run: python3 .github/scripts/fetch_oem.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/CSS_OEM.dat
          git diff --staged --quiet || git commit -m "chore: update CSS OEM $(date -u +%Y-%m-%d)"
          git push

  # 这个 job 负责强制部署 Pages
  deploy-pages:
    needs: fetch-and-commit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (Get latest commit)
        uses: actions/checkout@v4
        with:
          ref: main # 确保拉到的是刚刚 fetch-and-commit 提交后的最新代码

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # index.html 在根目录就写 '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
