name: Fetch Latest CSS OEM and Deploy

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]

# 确保并发部署不会冲突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write      # 需要这个权限直接写 Pages
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch OEM from CMSE
        run: python3 .github/workflows/scripts/fetch_oem.py

      # ── 新增：执行 TLE 抓取脚本 ──
      - name: Fetch TLE from CelesTrak
        run: python3 .github/workflows/scripts/fetch_tle.py

      # 修改：同时追踪 OEM 和 TLE 文件的变化
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 暂存这两个文件
          git add data/CSS_OEM.dat data/FYBB1.tle
          # 如果有任意一个文件发生改变，则提交并推送到仓库
          git diff --staged --quiet || git commit -m "chore: update CSS OEM and TLE $(date -u +%Y-%m-%d)"
          git push || echo "No changes to push"

      # 下面是官方推荐的直接部署 Pages 的做法
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
